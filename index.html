<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 員工工作看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: summary strip, worker grid, two columns (to confirm / activity feed), modals for detail */
  --bg:#f4f5f2; --card:#ffffff; --ink:#1d2421; --muted:#68726d; --line:#dfe3de;
  --accent:#1f6f5c; --accent-ink:#ffffff;
  --idle:#8a948f; --work:#1f8a4c; --wait:#b97a09; --err:#c0392b;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.05);
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --display:"Noto Serif TC","Songti TC",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --card:#182019; --ink:#e7ece9; --muted:#91a09a; --line:#2a3530;
    --accent:#4cc0a1; --accent-ink:#06231b;
    --idle:#7c8782; --work:#47c27a; --wait:#e2a530; --err:#ef6a5b;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --card:#182019; --ink:#e7ece9; --muted:#91a09a; --line:#2a3530;
  --accent:#4cc0a1; --accent-ink:#06231b;
  --idle:#7c8782; --work:#47c27a; --wait:#e2a530; --err:#ef6a5b;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.dot.working{background:var(--work);box-shadow:0 0 0 0 var(--work);animation:pulse 1.8s infinite}
.dot.waiting{background:var(--wait)}
.dot.error{background:var(--err)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,138,76,.5)}70%{box-shadow:0 0 0 8px rgba(31,138,76,0)}100%{box-shadow:0 0 0 0 rgba(31,138,76,0)}}
@media (prefers-reduced-motion:reduce){.dot.working{animation:none}}
.dot.live{background:var(--work)}
.hr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@keyframes flash{from{background:rgba(76,192,161,.35)}to{background:transparent}}
.row.fresh{animation:flash 2s ease-out}
@media (prefers-reduced-motion:reduce){.row.fresh{animation:none}}
h2{font-size:15px;margin:26px 0 10px;letter-spacing:.04em;color:var(--muted);font-weight:700}
/* ===== 圓潤暖色辦公室（黏土公仔風）===== */
.office{--sk1:#9fdcff;--sk2:#e8f7ff;--h1:#86cd72;--h2:#55a95f;--h3:#3f8f52;
  position:relative;border-radius:26px;overflow:hidden;background:#ffe9cc;box-shadow:0 10px 30px rgba(120,70,20,.22),0 0 0 4px #fff3de inset;font-family:var(--font)}
.office[data-tod=dusk]{--sk1:#ff9a78;--sk2:#ffd9a2;--h1:#6f9d5a;--h2:#44804f;--h3:#336a45}
.office[data-tod=night]{--sk1:#15204a;--sk2:#3a5489;--h1:#2f5a4a;--h2:#234a3d;--h3:#1b3d33}
.office::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:transparent;transition:background 1s}
.office[data-tod=dusk]::after{background:linear-gradient(rgba(255,140,70,.16),rgba(255,120,60,.10))}
.office[data-tod=night]::after{background:linear-gradient(rgba(20,24,80,.34),rgba(30,20,70,.26))}
.office svg{display:block}
.office svg .rt,.office svg .mv,.office svg .sk,.office svg .fl,.office svg .gr{transform-box:view-box}
.wall{position:relative;display:flex;justify-content:space-around;align-items:flex-end;height:140px;padding:0 10px;
  background:radial-gradient(120% 90% at 30% 0%,#fff6e4 0,transparent 60%),repeating-linear-gradient(90deg,#ffe3c0 0 38px,#ffdcb4 38px 40px);
  border-bottom:10px solid #c98a50;box-shadow:inset 0 -14px 18px -10px rgba(150,80,20,.25)}
.wall>div{align-self:flex-start}
.wall .win{margin-top:16px}.wall .win svg{width:104px;height:92px}
.wall .clk{margin-top:14px}.wall .clk svg{width:52px;height:52px}
.wall .plant{align-self:flex-end;margin-bottom:-2px}.wall .plant svg{width:50px;height:64px}
.wall .cof{align-self:flex-end;margin-bottom:-2px}.wall .cof svg{width:56px;height:74px}
.walk{position:relative;height:38px}
.cat{position:absolute;bottom:0;left:-70px;width:58px;height:40px;display:none;z-index:2;pointer-events:none}
.cat.on{display:block;animation:catwalk 17s linear forwards}
.cat svg{width:58px;height:40px}
@keyframes catwalk{from{left:-70px}to{left:100%}}
.cat .leg{animation:legs .45s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.cat .leg.b{animation-delay:.22s}
@keyframes legs{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.cat .tail{transform-box:fill-box;transform-origin:0 100%;animation:tail 1.2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
.floor{position:relative;padding:0 0 14px;
  background:repeating-linear-gradient(90deg,transparent 0 78px,rgba(120,70,30,.14) 78px 80px),
  linear-gradient(#e9b57c,#dca468 40%,#d29a5f)}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:linear-gradient(rgba(120,60,20,.22),transparent);pointer-events:none}
.desks{display:flex;flex-wrap:wrap;justify-content:center}
.desk{position:relative;display:block;flex:0 0 50%;max-width:50%;background:none;border:0;padding:0 2px 6px;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
@media (min-width:600px){.desk{flex-basis:33.3333%;max-width:33.3333%}}
@media (min-width:960px){.desk{flex-basis:20%;max-width:20%}}
.desk .spr{width:100%;height:auto;aspect-ratio:200/216;transition:transform .2s}
.desk:hover .spr{transform:translateY(-2px)}
.desk:active .spr{transform:scale(.98)}
.desk:focus-visible{outline:3px solid #fff;outline-offset:-3px;border-radius:18px}
/* 對話泡泡（working）/ 紅色驚嘆氣泡（waiting）*/
.bw{position:absolute;top:2px;left:6px;right:6px;z-index:2;pointer-events:none}
.bw[hidden]{display:none}
.bub{position:relative;background:#fffdf8;color:#4a3320;border-radius:14px;padding:4px 9px 4px;text-align:left;font-size:11px;line-height:1.28;
  box-shadow:0 3px 0 #ecd2ae,0 6px 12px rgba(120,70,20,.2);overflow-wrap:anywhere}
.bub::after{content:"";position:absolute;left:34px;bottom:-6px;width:12px;height:12px;background:inherit;border-radius:3px;transform:rotate(45deg);box-shadow:3px 3px 0 #ecd2ae}
.btx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.bdur{display:block;font-size:10px;color:#a37a52;margin-top:1px;font-weight:700}
.bw.wk .bdur::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#34b865;margin-right:4px;vertical-align:1px}
.bw.wt{display:flex;justify-content:center}
.bw.wt .bub{background:linear-gradient(#ff7a6e,#e5362f);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:16px;box-shadow:0 3px 0 #a9231e,0 8px 14px rgba(180,30,20,.35);animation:bounce 1s cubic-bezier(.3,1.5,.5,1) infinite}
.bw.wt .bub::after{background:#e5362f;box-shadow:3px 3px 0 #a9231e;left:50%;margin-left:-6px}
.bw.wt .btx{display:block}
.bw.wt .bdur{display:none}
.bw.wt .ex{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:#fff;color:#e5362f;text-align:center;margin-right:5px;font-size:13px}
.bw.er .bub{background:#fff1ee;color:#8a1d14}
@keyframes bounce{0%,100%{transform:translateY(3px)}40%{transform:translateY(-5px)}}
/* 桌牌 */
.desk .lb{display:inline-flex;align-items:center;gap:6px;max-width:94%;margin-top:-6px;background:linear-gradient(#fff8e8,#ffecc8);color:#5a3a1d;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;line-height:1.4;white-space:nowrap;
  box-shadow:0 2px 0 #d9a566,0 5px 10px rgba(120,70,20,.2)}
.desk .lb small{font-size:11px;font-weight:600;color:#9a7248}
.desk .lb .dot{width:8px;height:8px}
/* 小人姿勢：只顯示符合 data-st 的那一組（display:none 的動畫不會跑，省電）*/
.p{display:none}
.desk[data-st=idle] .p-idle,.desk[data-st=error] .p-idle,.desk[data-st=working] .p-work,.desk[data-st=waiting] .p-wait{display:inline}
/* 通用動畫積木：rt 旋轉 / mv 位移 / sk 縮放 / fl 飄浮淡出 / gr 長高 / bk 閃爍；加 .on 才會動，變數在 inline style */
.rt{transform:rotate(var(--a,0deg))}
.rt.on{animation:rtk var(--t,1s) ease-in-out var(--dl,0s) infinite}
@keyframes rtk{0%,100%{transform:rotate(var(--a))}50%{transform:rotate(var(--b))}}
.mv{transform:translate(var(--x0,0px),var(--y0,0px))}
.mv.on{animation:mvk var(--t,1s) ease-in-out var(--dl,0s) infinite}
@keyframes mvk{0%,100%{transform:translate(var(--x0),var(--y0))}50%{transform:translate(var(--x1),var(--y1))}}
.sk{transform:scale(var(--sx0,1),var(--sy0,1))}
.sk.on{animation:skk var(--t,1s) ease-in-out var(--dl,0s) infinite}
@keyframes skk{0%,100%{transform:scale(var(--sx0),var(--sy0))}50%{transform:scale(var(--sx1),var(--sy1))}}
.gr.on{animation:grk var(--t,4s) ease-in-out var(--dl,0s) infinite}
@keyframes grk{0%{transform:scaleY(.12)}80%,100%{transform:scaleY(1)}}
.fl{opacity:0;animation:flk var(--t,3s) ease-out var(--dl,0s) infinite}
@keyframes flk{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,-20px)) scale(1.05)}}
.bk{animation:bkk var(--t,1s) steps(1,end) var(--dl,0s) infinite}
@keyframes bkk{0%{opacity:1}50%{opacity:.15}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.nmk{animation:nmkk var(--t,3.2s) steps(1,end) var(--dl,0s) infinite}
@keyframes nmkk{0%{opacity:1}25%,100%{opacity:0}}
.steam{animation:steamk 3s ease-in-out infinite}
@keyframes steamk{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-4px)}}
.draw{stroke-dasharray:40;animation:drawk 2.4s ease-in-out infinite}
@keyframes drawk{0%{stroke-dashoffset:40}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.pulse{animation:pulsek 1.6s ease-in-out infinite}
@keyframes pulsek{0%,100%{opacity:.35}50%{opacity:.9}}
.dot.working{animation:pulse 1.8s infinite}
@media (prefers-reduced-motion:reduce){.office *{animation:none!important}.cat{display:none!important}.fl.z{opacity:.9}.steam{opacity:.6}}
.st{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-size:14px;overflow-wrap:anywhere}
.row .m{font-size:12px;color:var(--muted)}
.empty{padding:18px 14px;color:var(--muted);font-size:13.5px}
.btns{display:flex;gap:6px;flex:none}
button.b{font:inherit;font-size:13px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.b:disabled{opacity:.5;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(10,15,12,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.md{background:var(--card);border-radius:12px;width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.md .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.md .hd h3{margin:0;font-size:18px}
.md .bd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.md .lb{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.md textarea{width:100%;min-height:76px;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.logs{border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto}
.note{font-size:12.5px;color:var(--muted)}
.banner{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:13.5px;margin-bottom:14px}

.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.login h1{font-size:22px}
.login input{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.order{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.order textarea{width:100%;min-height:64px;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.order .r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
[hidden]{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>AI 員工工作看板</h1>
  <div class="note">請登入</div>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="密碼" autocomplete="current-password">
  <button class="b pri" id="lgbtn" type="button">登入</button>
  <div class="note" id="lgerr" style="color:var(--err)"></div>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>AI 員工工作看板</h1>
      <div class="sub">Unbound Studio · 3D 打印與激光雕刻 · Instagram 和小紅書</div>
    </div>
    <div class="hr"><div class="sum" id="sum"></div><span class="pill" id="conn"><span class="dot"></span><span>每 5 秒更新</span></span></div>
    <button class="linkbtn" id="logout" type="button">登出</button>
  </header>
  <div id="banner" class="banner" hidden></div>

  <h2>下單</h2>
  <div class="order">
    <textarea id="order-text" placeholder="直接寫你要什麼，總管會拆給各部門。例如：幫我想 5 個適合大馬新加坡賣的 3D 打印小物"></textarea>
    <div class="r"><span class="note">單子會排進清單，員工下次開工時領取。</span><button class="b pri" id="order-btn" type="button">下單給總管</button></div>
  </div>
  <h2>訂單進度</h2>
  <div class="panel" id="tasks"></div>

  <h2>員工</h2>
  <div class="office" id="grid"></div>

  <div class="cols">
    <div>
      <h2>等你確認</h2>
      <div class="panel" id="approve"></div>
    </div>
    <div>
      <h2>最新動態</h2>
      <div class="panel" id="feed"></div>
    </div>
  </div>
</div>

<div class="ov" id="ov"><div class="md" id="md" role="dialog" aria-modal="true"></div></div>

<script>
/* 圓潤暖色辦公室：場景（牆/窗/鐘/盆栽/咖啡機/貓）+ 九張桌子。
   每張桌子 = <button.desk data-st=狀態>，內含 inline SVG 黏土公仔（三組姿勢 p-idle/p-work/p-wait，CSS 依 data-st 切換）。
   結構：
     1. 工具：顏色混合、漸層登記（g/lg）、黏土塊 blob/rb、動畫積木 rt/mv/sk/fl/bk
     2. 公仔引擎：char(cfg, 狀態) 依 cfg 畫出 腳→身體→頭→桌子→道具→手臂（idle 趴睡時頭放在桌上）
     3. DEPTS：九個部門各自的 cfg（髮型/衣色/配件/道具/手臂動作）。客製某部門只要改對應 id 的物件。
     4. 場景與 render（狀態、泡泡、已工作 N 分鐘）。 */
var Office=(function(){
  /* ---------- 1. 工具 ---------- */
  function mix(h,t,a){var r=[1,3,5].map(function(i){return Math.round(parseInt(h.substr(i,2),16)*(1-a)+parseInt(t.substr(i,2),16)*a)});
    return "#"+r.map(function(v){return (v<16?"0":"")+v.toString(16)}).join("")}
  var DEFS={};
  function g(c){var k="g"+c.slice(1);  /* 黏土球面漸層：左上亮、右下暗 */
    if(!DEFS[k])DEFS[k]='<radialGradient id="'+k+'" cx=".34" cy=".26" r=".9"><stop offset="0" stop-color="'+mix(c,"#ffffff",.5)+'"/><stop offset=".5" stop-color="'+c+'"/><stop offset="1" stop-color="'+mix(c,"#000000",.3)+'"/></radialGradient>';
    return "url(#"+k+")"}
  function lg(c){var k="l"+c.slice(1);  /* 直向漸層：用在方塊/桌面 */
    if(!DEFS[k])DEFS[k]='<linearGradient id="'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+mix(c,"#ffffff",.4)+'"/><stop offset=".45" stop-color="'+c+'"/><stop offset="1" stop-color="'+mix(c,"#000000",.26)+'"/></linearGradient>';
    return "url(#"+k+")"}
  var STATIC='<radialGradient id="eyeg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#7a5444"/><stop offset="1" stop-color="#2a1710"/></radialGradient>'+
    '<radialGradient id="blush"><stop offset="0" stop-color="#ff7f8f" stop-opacity=".8"/><stop offset="1" stop-color="#ff7f8f" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="shd"><stop offset="0" stop-color="#6a3512" stop-opacity=".42"/><stop offset="1" stop-color="#6a3512" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="glowc"><stop offset="0" stop-color="#bff3ff" stop-opacity=".95"/><stop offset="1" stop-color="#bff3ff" stop-opacity="0"/></radialGradient>'+
    '<radialGradient id="rug"><stop offset=".6" stop-color="#fff4de" stop-opacity=".7"/><stop offset="1" stop-color="#fff4de" stop-opacity="0"/></radialGradient>'+
    '<clipPath id="cpcode"><rect x="104" y="106" width="42" height="17" rx="2"/></clipPath>'+
    '<clipPath id="cpchart"><rect x="121" y="88" width="52" height="30" rx="3"/></clipPath>';
  function ell(cx,cy,rx,ry,c,x){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+g(c)+'"'+(x||"")+'/>'}
  /* 黏土塊：漸層橢圓 + 左上高光 */
  function blob(cx,cy,rx,ry,c,x){return ell(cx,cy,rx,ry,c,x)+'<ellipse cx="'+(cx-rx*.3)+'" cy="'+(cy-ry*.55)+'" rx="'+rx*.42+'" ry="'+ry*.18+'" fill="#fff" opacity=".42" transform="rotate(-16 '+cx+' '+cy+')"/>'}
  /* 圓角方塊 + 頂部高光 */

    catEl.addEventListener("animationend",function(){catEl.classList.remove("on")});
    var st=document.createElement("style");   /* 窗外天色元素的顯示規則 */
    st.textContent=".office .stars,.office .sunw,.office .moonw,.office .cloudw,.office .fogw{display:none}.office[data-tod=day] .sunw,.office[data-tod=dusk] .sunw,.office[data-tod=day] .cloudw,.office[data-tod=night] .stars,.office[data-tod=night] .moonw{display:inline}"+
      ".office[data-tod=dusk] .sunw{transform:translateY(14px)}.office .fogw{display:none}.office.foggy .fogw{display:inline}.office .cl1{animation:cld 30s linear infinite alternate}@keyframes cld{from{transform:translateX(-6px)}to{transform:translateX(40px)}}.office .fg1{animation:cld 12s ease-in-out infinite alternate}.office .fg2{animation:cld 16s ease-in-out infinite alternate-reverse}.office[data-tod=night] .stars{display:inline}";
    host.appendChild(st);
    updateClock();
    if(!started){started=true;
      setInterval(function(){if(!document.hidden)updateClock()},20000);
      document.addEventListener("visibilitychange",function(){if(!document.hidden)updateClock()});
      setTimeout(catVisit,qs("cat")?500:12000+Math.random()*13000);
    }
  }
  function trunc(t){t=(t||"").replace(/\s+/g," ").trim();return t.length>40?t.slice(0,39)+"…":t}
  /* 已工作 N 分鐘（以員工列 updated_at 起算，與 modal 同一來源）*/
  function workedTxt(iso){
    var m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
    if(isNaN(m))return "";if(m<1)return "剛開工";
    if(m<60)return "已工作 "+m+" 分鐘";
    if(m<1440)return "已工作 "+Math.floor(m/60)+" 小時"+(m%60?" "+(m%60)+" 分":"");
    return "已工作 "+Math.floor(m/1440)+" 天";
  }
  function render(host,workers,onOpen,STATUS){
    if(root!==host||!host.firstChild)mount(host);
    var ids=workers.map(function(w){return w.id}).join();
    if(ids!==deskIds){
      deskIds=ids;desksEl.textContent="";
      if(!workers.length){var e=document.createElement("div");e.className="empty";e.textContent="還沒有員工資料。";e.style.cssText="width:100%;background:#fff6e0;color:#3a2a18";desksEl.appendChild(e)}
      workers.forEach(function(w){
        var b=document.createElement("button");b.type="button";b.className="desk";b.id="wk-"+w.id;
        b.innerHTML='<div class="bw" hidden><div class="bub"><span class="btx"></span><span class="bdur"></span></div></div>'+spriteSvg(w.id)+'<div class="lb"><span class="dot"></span><span class="nm"></span><small></small></div>';
        b.addEventListener("click",function(){onOpen(w.id)});
        desksEl.appendChild(b);
      });
      defsEl.innerHTML=STATIC+Object.keys(DEFS).map(function(k){return DEFS[k]}).join("");
    }
    workers.forEach(function(w){
      var b=document.getElementById("wk-"+w.id);if(!b)return;
      var wk=w.status==="working"?workedTxt(w.updatedAt):"";
      var sig=w.status+"|"+w.current+"|"+w.name+"|"+wk;
      if(b._sig!==sig){
        b._sig=sig;b.dataset.st=w.status;
        b.querySelector(".nm").textContent=w.name;
        b.querySelector("small").textContent=STATUS[w.status]||w.status;
        b.querySelector(".dot").className="dot "+(w.status==="idle"?"":w.status);
        var bw=b.querySelector(".bw"),bt=b.querySelector(".btx"),bd=b.querySelector(".bdur"),txt="",ex="";
        if(w.status==="waiting"){txt="等你確認"}
        else if(w.status==="working"||w.status==="error"){txt=trunc(w.current)}
        bw.className="bw"+(w.status==="waiting"?" wt":w.status==="working"?" wk":w.status==="error"?" er":"");
        bw.hidden=!txt;bt.textContent="";
        if(w.status==="waiting"){var x=document.createElement("span");x.className="ex";x.textContent="！";bt.appendChild(x)}
        bt.appendChild(document.createTextNode(txt));bd.textContent=wk;bd.hidden=!wk;
        b.setAttribute("aria-label",w.name+"，"+(STATUS[w.status]||w.status)+(wk?"（"+wk+"）":"")+(w.current?"：":"")+(w.current||""));
      }
      b.title=(w.role||"")+(w.current?"｜"+w.current:"");
    });
  }
  return {render:render};
})();
</script>
<script>
(function(){
  var STATUS={idle:"待命",working:"工作中",waiting:"等你確認",error:"異常"};
  var S={workers:[],logs:[],tasks:[],outputs:[],canWrite:true};
  function isPending(o){return o.status==="pending"}
  var db=null, ready=false, openId=null, modalSig=null, composing=false, modalDirty=false, fresh={}, seenLogs=null, lastSig="", loading=false, again=false, loadErr=false;

  function $(id){return document.getElementById(id)}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function ago(iso){
    if(!iso)return "尚無紀錄";
    var s=(Date.now()-new Date(iso).getTime())/1000;
    if(isNaN(s))return "";
    if(s<60)return "剛剛";
    if(s<3600)return Math.floor(s/60)+" 分鐘前";
    if(s<86400)return Math.floor(s/3600)+" 小時前";
    return Math.floor(s/86400)+" 天前";
  }
  function dur(iso){
    var m=Math.floor((Date.now()-new Date(iso).getTime())/60000);
    if(isNaN(m))return "";if(m<1)return "不到 1 分鐘";
    if(m<60)return m+" 分鐘";
    if(m<1440)return Math.floor(m/60)+" 小時"+(m%60?" "+(m%60)+" 分鐘":"");
    return Math.floor(m/1440)+" 天";
  }
  function wname(id){var w=S.workers.filter(function(x){return x.id===id})[0];return w?w.name:id}
  function showBanner(t){var b=$("banner");if(t){b.textContent=t;b.hidden=false}else b.hidden=true}

  function renderSummary(){
    var c={working:0,waiting:0,error:0};
    S.workers.forEach(function(w){if(c[w.status]!=null)c[w.status]++});
    var pend=S.outputs.filter(isPending).length;
    var box=$("sum");box.textContent="";
    [["working","工作中 "+c.working],["waiting","待確認 "+pend],["error","異常 "+c.error]].forEach(function(p){
      var s=el("span","pill");s.appendChild(el("span","dot "+(p[0]==="working"&&c.working?"working":p[0]==="waiting"?"waiting":p[0]==="error"?"error":"")));
      s.appendChild(document.createTextNode(p[1]));box.appendChild(s)});
  }

  function renderGrid(){Office.render($("grid"),S.workers,openWorker,STATUS)}

  function renderApprove(){
    var p=$("approve");p.textContent="";
    var list=S.outputs.filter(isPending);
    if(!list.length){p.appendChild(el("div","empty","目前沒有需要你確認的項目。員工交出成品後會出現在這裡。"));return}
    list.forEach(function(o){
      var r=el("div","row");var l=el("div");
      l.appendChild(el("div","t",o.title||"未命名成品"));
      l.appendChild(el("div","m",wname(o.worker)+" · "+ago(o.at)));
      r.appendChild(l);
      var bt=el("div","btns");
      var v=el("button","b","查看");v.type="button";v.addEventListener("click",function(){openOutput(o)});
      bt.appendChild(v);r.appendChild(bt);p.appendChild(r);
    });
  }

  function renderFeed(){
    var p=$("feed");p.textContent="";
    if(!S.logs.length){p.appendChild(el("div","empty","還沒有動態。"));return}
    S.logs.slice(0,25).forEach(function(l){
      var r=el("div","row"+(fresh[l.id]?" fresh":""));var d=el("div");
      d.appendChild(el("div","t",l.text||""));
      d.appendChild(el("div","m",wname(l.worker)+" · "+ago(l.at)));
      r.appendChild(d);p.appendChild(r);
    });
  }

  function renderAll(){renderSummary();renderTasks();renderGrid();renderApprove();renderFeed();
    if(openId){var sg=JSON.stringify([S.workers.filter(function(x){return x.id===openId}),S.tasks.filter(function(x){return x.worker===openId}).slice(0,6),S.logs.filter(function(x){return x.worker===openId}).slice(0,12)]);
      if(sg!==modalSig)renderWorkerModal(openId,true)}}

  function closeModal(){$("ov").classList.remove("on");$("md").textContent="";openId=null;modalSig=null;composing=false;modalDirty=false}
  $("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeModal()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});

  function modalHead(title,sub){
    var h=el("div","hd");var t=el("div");t.appendChild(el("h3","",title));if(sub)t.appendChild(el("div","note",sub));h.appendChild(t);
    var x=el("button","b","關閉");x.type="button";x.addEventListener("click",closeModal);h.appendChild(x);return h;
  }

  function openWorker(id){openId=id;modalSig=null;$("ov").classList.add("on");renderWorkerModal(id,false)}
  function renderWorkerModal(id,keepDraft){
    var w=S.workers.filter(function(x){return x.id===id})[0];if(!w){closeModal();return}
    var md=$("md");var draft="";var ta=md.querySelector("textarea");
    if(keepDraft&&composing){modalDirty=true;return}
    var hadFocus=false,ss=0,se=0,sc=md.scrollTop,ts=ta?ta.scrollTop:0;
    if(ta&&keepDraft){draft=ta.value;hadFocus=document.activeElement===ta;ss=ta.selectionStart;se=ta.selectionEnd}
    modalSig=JSON.stringify([w,S.tasks.filter(function(x){return x.worker===id}).slice(0,6),S.logs.filter(function(x){return x.worker===id}).slice(0,12)]);
    md.textContent="";
    md.appendChild(modalHead(w.name,w.role));
    var bd=el("div","bd");
    var a=el("div");a.appendChild(el("div","lb","現在狀態"));
    var st=el("span","st");st.appendChild(el("span","dot "+(w.status==="idle"?"":w.status)));st.appendChild(document.createTextNode((STATUS[w.status]||w.status)+"　"+(w.current||"目前沒有進行中的工作")));
    a.appendChild(st);bd.appendChild(a);
    var b=el("div");b.appendChild(el("div","lb","負責範圍"));b.appendChild(el("div","",w.scope||""));bd.appendChild(b);

    var c=el("div");c.appendChild(el("div","lb","派一個任務給 "+w.name));
    var t=el("textarea");t.id="task-text";t.placeholder="例如：想 10 個適合在大馬和新加坡賣的 3D 打印小物";t.value=draft;c.appendChild(t);
    t.addEventListener("compositionstart",function(){composing=true});
    t.addEventListener("compositionend",function(){composing=false;if(modalDirty){modalDirty=false;if(openId)renderWorkerModal(openId,true)}});
    var row=el("div","btns");row.style.marginTop="6px";
    var send=el("button","b pri","派任務");send.type="button";send.disabled=!S.canWrite;
    send.addEventListener("click",function(){addTask(w.id,t,send)});row.appendChild(send);
    if(!S.canWrite)row.appendChild(el("span","note","你目前沒有寫入權限"));
    c.appendChild(row);
    c.appendChild(el("div","note","任務會排進下面的清單，員工下次開工時領取。"));bd.appendChild(c);

    var tk=S.tasks.filter(function(x){return x.worker===id}).slice(0,6);
    var d=el("div");d.appendChild(el("div","lb","任務清單"));
    var tl=el("div","logs");
    if(!tk.length)tl.appendChild(el("div","empty","還沒有任務。"));
    tk.forEach(function(x){var r=el("div","row");var dd=el("div");dd.appendChild(el("div","t",x.text));dd.appendChild(el("div","m",(x.status||"待處理")+" · "+ago(x.createdAt)));r.appendChild(dd);tl.appendChild(r)});
    d.appendChild(tl);bd.appendChild(d);

    var lg=S.logs.filter(function(x){return x.worker===id}).slice(0,12);
    var e=el("div");e.appendChild(el("div","lb","工作紀錄"));
    var ll=el("div","logs");
    if(!lg.length)ll.appendChild(el("div","empty","還沒有紀錄。"));
    lg.forEach(function(x){var r=el("div","row");var dd=el("div");dd.appendChild(el("div","t",x.text));dd.appendChild(el("div","m",ago(x.at)));r.appendChild(dd);ll.appendChild(r)});
    e.appendChild(ll);bd.appendChild(e);
    md.appendChild(bd);
    md.scrollTop=sc;
    if(keepDraft){t.scrollTop=ts;if(hadFocus){t.focus({preventScroll:true});try{t.setSelectionRange(ss,se)}catch(_){}}}
  }

  function openOutput(o){
    openId=null;$("ov").classList.add("on");var md=$("md");md.textContent="";
    md.appendChild(modalHead(o.title||"成品",wname(o.worker)+" · "+ago(o.at)));
    var bd=el("div","bd");
    var body=el("div","",o.body||"");body.style.whiteSpace="pre-wrap";body.style.overflowWrap="anywhere";bd.appendChild(body);
    var r=el("div","btns");
    var ok=el("button","b pri","批准");ok.type="button";ok.disabled=!S.canWrite;
    var no=el("button","b","退回");no.type="button";no.disabled=!S.canWrite;
    ok.addEventListener("click",function(){setOutput(o.id,"approved",ok,no)});
    no.addEventListener("click",function(){setOutput(o.id,"rejected",ok,no)});
    r.appendChild(ok);r.appendChild(no);bd.appendChild(r);md.appendChild(bd);
  }

  function setOutput(id,status,a,b){
    if(!sb){showBanner("示範模式：不會真的送出");closeModal();return}
    a.disabled=b.disabled=true;var old=a.textContent;a.textContent="處理中…";
    var bd=a.parentNode.parentNode;var m=bd.querySelector(".errmsg");if(m)m.remove();
    sb.from("board_outputs").update({status:status,decided_at:new Date().toISOString()}).eq("id",id).then(function(r){
      if(r.error){a.textContent=old;a.disabled=b.disabled=false;var x=el("div","errmsg","沒有儲存成功："+r.error.message);x.style.cssText="color:#b3261e;margin-top:8px";bd.appendChild(x);return}
      closeModal();load();
    });
  }
  function addTask(worker,ta,btn){
    var text=ta.value.trim();if(!text)return;
    if(!sb){showBanner("示範模式：不會真的送出");return}
    btn.disabled=true;
    sb.from("board_tasks").insert({worker:worker,text:text}).then(function(r){
      btn.disabled=false;
      if(r.error){showBanner("任務沒有送出："+r.error.message);return}
      showBanner("");ta.value="";load();
    });
  }
  function renderTasks(){
    var p=$("tasks");p.textContent="";
    if(!S.tasks.length){p.appendChild(el("div","empty","還沒有訂單。"));return}
    S.tasks.slice(0,8).forEach(function(x){var r=el("div","row");var d=el("div");
      d.appendChild(el("div","t",x.text));d.appendChild(el("div","m",wname(x.worker)+" · "+(x.status||"待處理")+" · "+ago(x.createdAt)));
      r.appendChild(d);p.appendChild(r)});
  }

  var SB_URL="https://zyeyhyfdjtgmoocdjgcg.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5ZXloeWZkanRnbW9vY2RqZ2NnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NTAxMjIsImV4cCI6MjA5MDMyNjEyMn0.9W1f4KWxj82J8cgD1oPEmMfpqcFe11an9v9-ybjV-Sw";
  var DEMO=/[?&]demo(=|&|$)/.test(location.search);
  var sb=DEMO?null:supabase.createClient(SB_URL,SB_KEY);
  var ready=false;
  function mapW(r){return{id:r.id,name:r.name,role:r.role,scope:r.scope,status:r.status,current:r.current_text,order:r.sort_order,updatedAt:r.updated_at}}
  function mapL(r){return{id:r.id,worker:r.worker,text:r.text,at:r.at}}
  function mapT(r){return{id:r.id,worker:r.worker,text:r.text,status:r.status,createdAt:r.created_at}}
  function mapO(r){return{id:r.id,worker:r.worker,title:r.title,body:r.body,status:r.status,at:r.at}}
  function load(){
    if(loading){again=true;return Promise.resolve()}
    loading=true;
    return Promise.all([
      sb.from("board_workers").select("*").order("sort_order"),
      sb.from("board_logs").select("*").order("at",{ascending:false}).limit(80),
      sb.from("board_tasks").select("*").order("created_at",{ascending:false}).limit(80),
      sb.from("board_outputs").select("*").order("at",{ascending:false}).limit(80)
    ]).then(function(rs){
      var err=rs.filter(function(r){return r.error})[0];
      if(err){loadErr=true;showBanner("讀取資料時出錯："+err.error.message);return}
      ready=true;if(loadErr){loadErr=false;showBanner("")}
      var sig=JSON.stringify([rs[0].data,rs[1].data,rs[2].data,rs[3].data]);
      if(sig===lastSig)return;
      lastSig=sig;
      S.workers=rs[0].data.map(mapW);S.logs=rs[1].data.map(mapL);S.tasks=rs[2].data.map(mapT);S.outputs=rs[3].data.map(mapO);
      fresh={};
      if(seenLogs)S.logs.forEach(function(l){if(!seenLogs[l.id])fresh[l.id]=1});
      seenLogs={};S.logs.forEach(function(l){seenLogs[l.id]=1});
      renderAll();fresh={};
    }).catch(function(){loadErr=true;showBanner("暫時連不上資料，可能顯示的是舊內容。")}).then(function(){loading=false;if(again){again=false;load()}});
  }


  /* ?demo：假資料預覽（不連 Supabase、不需登入）。?demo&tod=night|dusk|day&fog=1 可強制天色/霧 */
  function startDemo(){
    var ago_=function(m){return new Date(Date.now()-m*60000).toISOString()};
    var W=[["w1-boss","總管","統籌與派工","idle","",1],["w2-plan","策劃部","企劃與選題","waiting","IG 十月內容企劃草稿等你看",2],
      ["w3-product","產品部","3D 打印產品開發","idle","",3],["w4-copy","文案部","貼文與標題","idle","",4],
      ["w5-video","影像腳本部","短片腳本與分鏡","working","寫 Reel 腳本：Unbound 開箱 30 秒版本",5],["w6-data","數據部","數據與報表","idle","",6],
      ["w7-ops","後台部","後台與客服","idle","",7],["w8-books","帳務部","記帳與對帳","working","核對 10 月收據並登錄帳目",8],
      ["w9-sys","系統部","網站與系統","idle","",9]];
    S.workers=W.map(function(r){return{id:r[0],name:r[1],role:r[2],scope:r[2],status:r[3],current:r[4],order:r[5],updatedAt:ago_(r[3]==="idle"?240:12)}});
    S.tasks=[{id:1,worker:"w1-boss",text:"（示範）幫我想 5 個適合大馬賣的 3D 打印小物",status:"進行中",createdAt:ago_(30)}];
    S.logs=[{id:1,worker:"w8-books",text:"開始核對 10 月收據",at:ago_(12)},{id:2,worker:"w5-video",text:"開始寫 Reel 腳本",at:ago_(8)}];
    S.outputs=[{id:1,worker:"w2-plan",title:"（示範）IG 十月內容企劃",body:"示範內容",status:"pending",at:ago_(20)}];
    ready=true;$("app").hidden=false;$("login").hidden=true;showBanner("示範模式：假資料，不連線。");renderAll();
    tick=setInterval(function(){if(!document.hidden)tickRender()},30000);
    window.__demoSet=function(id,st,txt){S.workers.forEach(function(w){if(w.id===id){w.status=st;w.current=txt||""}});renderAll()};
  }
  var poll=null, tick=null, chan=null, rtState="off", dbt=null;
  function setConn(){
    var c=$("conn");c.textContent="";
    var d=el("span","dot"+(rtState==="live"?" live":rtState==="retry"?" waiting":""));
    c.appendChild(d);c.appendChild(el("span","",rtState==="live"?"即時連線中":rtState==="retry"?"重新連線中":"每 5 秒更新"));
  }
  function scheduleLoad(){clearTimeout(dbt);dbt=setTimeout(load,150)}
  function subscribe(){
    if(chan)return;
    var ch=sb.channel("board");
    ["board_workers","board_logs","board_tasks","board_outputs"].forEach(function(t){
      ch=ch.on("postgres_changes",{event:"*",schema:"public",table:t},scheduleLoad);
    });
    chan=ch;
    ch.subscribe(function(status){
      if(chan!==ch)return;
      if(status==="SUBSCRIBED"){rtState="live";load()}
      else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED")rtState="retry";
      setConn();
    });
  }
  function unsubscribe(){
    clearTimeout(dbt);
    if(chan){var c=chan;chan=null;sb.removeChannel(c)}
    rtState="off";setConn();
  }
  function tickRender(){renderSummary();renderTasks();renderGrid();renderApprove();renderFeed()}
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&poll)load()});
  function showApp(on){$("app").hidden=!on;$("login").hidden=on;
    if(on){load();subscribe();
      if(!poll)poll=setInterval(function(){if(!document.hidden)load()},5000);
      if(!tick)tick=setInterval(function(){if(!document.hidden&&ready)tickRender()},30000)}
    else{
      if(poll){clearInterval(poll);poll=null}
      if(tick){clearInterval(tick);tick=null}
      unsubscribe();lastSig="";seenLogs=null;ready=false;closeModal()}}
  $("lgbtn").addEventListener("click",function(){
    $("lgerr").textContent="";
    sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value}).then(function(r){
      if(r.error){$("lgerr").textContent="登入失敗："+r.error.message;return}
      showApp(true)});
  });
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("lgbtn").click()});
  $("logout").addEventListener("click",function(){sb.auth.signOut().then(function(){S.workers=[];S.logs=[];S.tasks=[];S.outputs=[];showApp(false)})});
  $("order-btn").addEventListener("click",function(){addTask("w1-boss",$("order-text"),$("order-btn"))});
  if(DEMO)startDemo();
  else sb.auth.getSession().then(function(r){showApp(!!(r.data&&r.data.session))});
})();
</script>
