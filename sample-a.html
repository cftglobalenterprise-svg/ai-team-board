*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff3e0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#5a3a22}
.wrap{max-width:430px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:19px;margin:6px 0 2px;text-align:center}
.sub{font-size:12px;text-align:center;opacity:.7;margin-bottom:12px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;border-radius:999px;padding:9px 14px;font:700 14px inherit;font-family:inherit;color:#7a4a22;background:#ffe3bd;box-shadow:0 3px 0 #e8b985;cursor:pointer}
.tabs button.on{background:#ff9a3c;color:#fff;box-shadow:0 3px 0 #c9701a}
.card{background:#fff;border-radius:28px;padding:8px;margin-bottom:16px;box-shadow:0 8px 22px rgba(150,80,20,.18),0 2px 0 #f3d6b0}
.card.hide{display:none}
.card svg{display:block;width:100%;height:auto;border-radius:22px}
.cap{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-weight:800;font-size:15px}
.cap small{font-weight:600;opacity:.65;font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sc *{transform-box:view-box}
/* common */
.sc .steam{animation:steam 3s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:.9;transform:translateY(-3px)}}
/* idle */
.idle .breath,.idle .breath2{animation:breathe 4s ease-in-out infinite;transform-origin:150px 250px}
.idle .headrest{transform:translate(26px,44px) rotate(16deg);transform-origin:150px 130px}
.idle .slump{transform:translate(12px,14px) rotate(8deg);transform-origin:150px 250px}
.idle .breath2{transform-origin:150px 200px}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,1.04)}}
.idle .z{opacity:0;animation:zfloat 4.2s ease-in-out infinite}
.idle .z2{animation-delay:1.1s}.idle .z3{animation-delay:2.2s}
@keyframes zfloat{0%{opacity:0;transform:translate(-10px,22px) scale(.6)}25%{opacity:1}80%{opacity:.9}100%{opacity:0;transform:translate(14px,-26px) scale(1.1)}}
.idle .armL,.idle .armR{transform-origin:0 0}
.idle .armL{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(18deg)}50%{transform:rotate(14deg)}}
.idle .armR{transform:rotate(6deg)!important}
/* working */
.work .bounce{animation:bob .8s ease-in-out infinite;transform-origin:150px 250px}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.01,.99)}}
.work .armL{transform-origin:0 0;animation:press .7s ease-in-out infinite}
@keyframes press{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(-14deg)}}
.work .armR{transform-origin:0 0;animation:stampArm 1.6s ease-in-out infinite}
@keyframes stampArm{0%,100%{transform:rotate(-42deg)}35%{transform:rotate(-58deg)}60%{transform:rotate(-44deg)}70%{transform:rotate(-40deg)}}
.work .mark{opacity:0;animation:mark 1.6s ease-out infinite}
@keyframes mark{0%,62%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.15)}78%{transform:scale(1)}95%{opacity:.9}100%{opacity:0}}
.work .mark{transform-origin:252px 240px}
.work .n{opacity:0;animation:num 2.4s steps(1) infinite}
.work .n1{animation-delay:.6s}.work .n2{animation-delay:1.2s}.work .n3{animation-delay:1.8s}
@keyframes num{0%{opacity:1}25%,100%{opacity:0}}
.work .pop{opacity:0;animation:pop 2.4s ease-out infinite}
.work .p2{animation-delay:.8s}.work .p3{animation-delay:1.6s}
@keyframes pop{0%{opacity:0;transform:translateY(34px) scale(.6)}15%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(1.08)}}
.work .k{animation:keyp .7s ease-in-out infinite}
.work .k01{animation-delay:.1s}.work .k12{animation-delay:.35s}
@keyframes keyp{0%,100%{opacity:1}50%{opacity:.82}}
/* waiting */
.wait .bounce2{animation:bob2 1.2s ease-in-out infinite;transform-origin:150px 250px}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wait .armR{transform-origin:0 0;animation:wave .9s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-118deg)}50%{transform:rotate(-152deg)}}
.wait .armL{transform-origin:0 0}
.wait .alertin{transform-origin:236px 80px;animation:alert 1s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes alert{0%{transform:translateY(8px) scale(.85)}35%{transform:translateY(-8px) scale(1.06)}60%{transform:translateY(0) scale(1)}100%{transform:translateY(8px) scale(.85)}}
@media (prefers-reduced-motion:reduce){.sc *{animation:none!important}.work .n0{opacity:1}.work .pop,.work .mark{opacity:1}.idle .z{opacity:1}.work .p2,.work .p3{opacity:0}}
</style></head><body>
